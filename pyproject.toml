[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "touhou-rl-mcp"
version = "0.1.0"
description = "Touhou Project RL environment exposed as an MCP server (reset / step / reward / screenshot)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["touhou", "reinforcement-learning", "mcp", "agentic-rl", "game-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=2.0,<3",
    "pillow>=10.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
windows = ["pywin32>=306 ; sys_platform == 'win32'"]
dev = ["ruff>=0.6", "pywin32>=306 ; sys_platform == 'win32'"]

[project.scripts]
touhou-rl-mcp = "touhou_rl_mcp.__main__:main"
touhou-rl-dashboard = "touhou_rl_mcp.dashboard.server:main"

[tool.setuptools]
packages = [
    "touhou_rl_mcp",
    "touhou_rl_mcp.backends",
    "touhou_rl_mcp.capture",
    "touhou_rl_mcp.dashboard",
    "touhou_rl_mcp.games",
    "touhou_rl_mcp.inputs",
    "touhou_rl_mcp.memory",
    "touhou_rl_mcp.rl",
    "touhou_rl_mcp.training",
]

[tool.setuptools.package-data]
"touhou_rl_mcp.games" = ["offsets/*.json"]
"touhou_rl_mcp.dashboard" = ["static/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", ".runtime", "archive", "native"]

[tool.ruff.lint]
# 只启用"一定是 bug"的规则 (语法错误 / 未定义名 / 未使用变量)。
# 风格类规则暂不启用，避免历史代码产生大量噪声。
select = ["E9", "F"]
ignore = ["F401", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
